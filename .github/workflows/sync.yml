name: sync-upstream

# Pull updates from jealous-sound/azerothcore-wotlk-playerbot (branch Playerbot) into this fork and push.
# Uses PAT (not GITHUB_TOKEN) so the push triggers the coa-bot-build workflow.
# After merging upstream, any upstream CI files re-added by the merge are stripped back out,
# keeping ONLY our build.yml + sync.yml (bot-only strategy to save CI minutes).

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (Playerbot)
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0
          ref: Playerbot

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream & fetch
        run: |
          git remote add upstream https://github.com/jealous-sound/azerothcore-wotlk-playerbot.git \
            || git remote set-url upstream https://github.com/jealous-sound/azerothcore-wotlk-playerbot.git
          git fetch upstream Playerbot

      - name: Merge upstream/Playerbot
        id: merge
        run: |
          if git merge --no-edit upstream/Playerbot; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Drop upstream CI re-added by merge (keep only build/sync)
        if: steps.merge.outputs.status == 'ok'
        run: |
          shopt -s nullglob
          for f in .github/workflows/*; do
            case "$(basename "$f")" in
              build.yml|sync.yml) continue;;
            esac
            git rm -f "$f" || true
          done
          if git diff --cached --quiet; then
            echo "no upstream CI re-added; nothing to clean"
          else
            git commit -m "chore: keep only build/sync workflows after upstream merge"
          fi

      - name: Push to fork
        if: steps.merge.outputs.status == 'ok'
        run: |
          git push https://x-access-token:${{ secrets.PAT }}@github.com/callmefree/azerothcore-wotlk-playerbot.git Playerbot

      - name: Open issue on conflict
        if: steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh issue create --repo callmefree/azerothcore-wotlk-playerbot \
            --title "Sync conflict with upstream Playerbot" \
            --body "Automated sync from jealous-sound/azerothcore-wotlk-playerbot hit a merge conflict. Please resolve manually, then re-run this workflow." \
            --label "sync-conflict" || true
          exit 1
