name: coa-bot-build

# CoA Playerbots Windows x64 build — follows the REAL upstream of the running
# CoA Bots v1.x (repack main-20260919-b3717c137 + mod-playerbots coa branch).
#
# Source combination (authoritative, from Zyth45/mod-playerbots README_COA.md):
#   core   : jealous-sound/azerothcore-wotlk-coa  @ main        (carries bot hooks
#            #3069 + crash fixes #3072/3075/3080/3083/3085 since 2026-09-17)
#   module : Zyth45/mod-playerbots               @ coa          (CoA bot AI)
# No core fork is needed any more; the module lives in modules/ which the core
# .gitignore leaves alone.
#
# This workflow does NOT apply the level-255 patch set (that is a separate
# third-party variant, vladbr2000/coa-level255-exact, not part of v1.3).

on:
  push:
    branches: [ "Playerbot" ]
    paths-ignore:
      - '.github/**'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'jealous-sound/azerothcore-wotlk-coa ref (branch/tag/sha)'
        required: false
        default: 'main'
      module_ref:
        description: 'Zyth45/mod-playerbots ref (branch/tag/sha)'
        required: false
        default: 'coa'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    name: windows-latest
    env:
      BOOST_ROOT: C:\local\boost_1_87_0
      CORE_REF: ${{ github.event.inputs.core_ref || 'main' }}
      MODULE_REF: ${{ github.event.inputs.module_ref || 'coa' }}
    steps:
      - name: Checkout build driver (this repo)
        uses: actions/checkout@v7
        with:
          path: driver

      - name: Checkout CoA core (jealous-sound, no fork needed)
        uses: actions/checkout@v7
        with:
          repository: jealous-sound/azerothcore-wotlk-coa
          ref: ${{ env.CORE_REF }}
          fetch-depth: 0
          path: source

      - name: Checkout CoA playerbots module (Zyth45 coa branch)
        uses: actions/checkout@v7
        with:
          repository: Zyth45/mod-playerbots
          ref: ${{ env.MODULE_REF }}
          path: source/modules/mod-playerbots

      - name: Cache Boost & MySQL
        uses: actions/cache@v6
        with:
          path: |
            C:\local\boost_1_87_0
            C:\tools\mysql\current
          key: winbuild-deps:boost-1.87.0:mysql-8.4.9

      - name: Configure OS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path 'C:\local\boost_1_87_0\boost'))
          {
              $boostExe = Join-Path $env:RUNNER_TEMP 'boost.exe'
              $boostUrl = 'https://downloads.sourceforge.net/project/boost/boost-binaries/' +
                  '1.87.0/boost_1_87_0-msvc-14.3-64.exe'
              $boostRequest = @{
                  Uri                      = $boostUrl
                  OutFile                  = $boostExe
                  UserAgent                = 'azerothcore-ci'
                  ConnectionTimeoutSeconds = 60
                  OperationTimeoutSeconds  = 60
              }
              $boostAttempts = 3
              for ($attempt = 1; $attempt -le $boostAttempts; $attempt++)
              {
                  try
                  {
                      Invoke-WebRequest @boostRequest
                      $boostMB = (Get-Item $boostExe).Length / 1MB
                      if ($boostMB -lt 50) { throw "got $([int]$boostMB) MB, likely an HTML page." }
                      break
                  }
                  catch
                  {
                      Write-Host "Boost download attempt $attempt failed: $($_.Exception.Message)"
                      if ($attempt -eq $boostAttempts) { throw }
                      Start-Sleep -Seconds 15
                  }
              }
              Write-Host ("Downloaded Boost installer: {0:N1} MB" -f $boostMB)
              $boostProc = Start-Process -FilePath $boostExe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\local\boost_1_87_0' -Wait -PassThru
              if ($boostProc.ExitCode -ne 0) { throw "Boost installer failed with exit code $($boostProc.ExitCode)." }
              if (-not (Test-Path 'C:\local\boost_1_87_0\boost\version.hpp')) { throw 'Boost install missing headers at C:\local\boost_1_87_0\boost.' }
              if (-not (Test-Path 'C:\local\boost_1_87_0\lib64-msvc-14.3')) { throw 'Boost install missing prebuilt libs at C:\local\boost_1_87_0\lib64-msvc-14.3.' }
          }

          if (-not (Test-Path 'C:\tools\mysql\current\lib\mysqlclient.lib'))
          {
              $mysqlZip = Join-Path $env:RUNNER_TEMP 'mysql.zip'
              Invoke-WebRequest -Uri 'https://cdn.mysql.com/archives/mysql-8.4/mysql-8.4.9-winx64.zip' -OutFile $mysqlZip -UserAgent 'Mozilla/5.0'
              $mysqlMB = (Get-Item $mysqlZip).Length / 1MB
              Write-Host ("Downloaded MySQL zip: {0:N1} MB" -f $mysqlMB)
              if ($mysqlMB -lt 50) { throw "MySQL zip download looks wrong ($([int]$mysqlMB) MB)." }
              New-Item -ItemType Directory -Force -Path 'C:\tools\mysql' | Out-Null
              Expand-Archive -Path $mysqlZip -DestinationPath 'C:\tools\mysql' -Force
              if (Test-Path 'C:\tools\mysql\current') { Remove-Item -Recurse -Force 'C:\tools\mysql\current' }
              Rename-Item 'C:\tools\mysql\mysql-8.4.9-winx64' 'C:\tools\mysql\current'
              if (-not (Test-Path 'C:\tools\mysql\current\lib\mysqlclient.lib')) { throw 'MySQL client import library missing at C:\tools\mysql\current\lib\mysqlclient.lib.' }
          }

          $opensslRoot = @($env:OPENSSL_ROOT_DIR, 'C:\Program Files\OpenSSL', 'C:\Program Files\OpenSSL-Win64') |
              Where-Object { $_ -and (Test-Path (Join-Path $_ 'include\openssl\opensslv.h')) } |
              Select-Object -First 1
          if (-not $opensslRoot)
          {
              throw 'No OpenSSL development install found on the runner image.'
          }
          "OPENSSL_ROOT_DIR=$opensslRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using OpenSSL at $opensslRoot"

      - name: Record resolved source revisions
        shell: bash
        working-directory: source
        run: |
          echo "core   : $(git rev-parse HEAD)  ($(git describe --tags --always 2>/dev/null || echo no-tag))"
          echo "module : $(git -C modules/mod-playerbots rev-parse HEAD)"

      - name: Build worldserver only
        shell: bash
        working-directory: source
        run: |
          export CTOOLS_BUILD=all
          # authserver/dbimport 无变化，仅 configure + 单编 worldserver（含其依赖库），省编译时间。
          # 注意：本仓库 acore.sh 的构建目录是 var/build/obj（非上游旧版的 build/）。
          ./acore.sh compiler configure
          cmake --build var/build/obj --target worldserver --config RelWithDebInfo -j "$(nproc 2>/dev/null || echo 4)"

      - name: Collect worldserver artifact
        if: success()
        shell: bash
        working-directory: source
        run: |
          rm -rf ../artifact && mkdir -p ../artifact
          WS=$(find var/build/obj -name worldserver.exe -path '*RelWithDebInfo*' 2>/dev/null | head -1)
          if [ -z "$WS" ]; then
            echo "worldserver.exe not found under var/build/obj; dumping any worldserver binaries:"
            find . -name 'worldserver*.exe' 2>/dev/null | head
            exit 1
          fi
          D=$(dirname "$WS")
          cp "$D/worldserver.exe" ../artifact/
          cp "$D/"*.dll ../artifact/ 2>/dev/null || true
          [ -d "$D/configs" ] && cp -r "$D/configs" ../artifact/ || true
          echo "Collected worldserver artifact from $D"
          ls -la ../artifact

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coa-bot-win64
          path: artifact/
          retention-days: 7

      - name: Open issue on build failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Windows build failed ($(date -u +%Y-%m-%d))" \
            --body "The CoA bots Windows build failed. Core ref: $CORE_REF, module ref: $MODULE_REF. Check the run logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --label "ci-failure" || true
